<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Racing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Game Header -->
        <header class="game-header">
            <h1>🏍️ Bike Racing Game</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Speed:</span>
                    <span id="speed" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Distance:</span>
                    <span id="distance" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <!-- Game Canvas -->
        <div class="game-area">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
        </div>

        <!-- Game Controls -->
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
            <button id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>

        <!-- Game Info -->
        <div class="game-info">
            <p><strong>Controls:</strong> Use <span class="key">←</span> <span class="key">→</span> Arrow Keys to Move</p>
            <p><strong>Objective:</strong> Avoid obstacles and collect coins to score points!</p>
        </div>

        <!-- Game Over Modal -->
        <div id="gameOverModal" class="modal hidden">
            <div class="modal-content">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <p>Distance Traveled: <span id="finalDistance">0</span>m</p>
                <button id="restartBtn" class="btn btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
